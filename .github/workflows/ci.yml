name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

      # Retrieval regression gate: real embedder, synthetic corpus (generated, not committed), no LLM
      # calls. Fails if Recall@5 or MRR drops below eval/baselines/ci_retrieval.json. See eval/README.md.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          # model2vec (the default embedding backend) downloads to the Hugging Face cache;
          # data/models only holds the optional fastembed backend's files.
          path: |
            ~/.cache/huggingface
            data/models
          key: embeddings-potion-retrieval-32M-v1
      - name: Retrieval eval gate
        run: python -m eval.retrieval_eval --fixture --check
      - name: Upload retrieval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-ci-results
          path: eval/results/retrieval_ci_latest.json
          if-no-files-found: ignore
